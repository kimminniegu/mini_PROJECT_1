<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOB DIARY (잡 다이어리)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'diary-bg': '#f3efe6',        /* 바탕 배경 */
                        'diary-cover': '#e8dec8',     /* 다이어리 겉표지 */
                        'diary-paper': '#fffdf9',     /* 종이 내지 */
                        'diary-line': '#e2dad0',      /* 바인더 라인/점선 */
                        'tab-active': '#fffdf9',
                        'tab-inactive': '#e5dac7'
                    }
                }
            }
        }
    </script>
    <style>
        /* 레트로 다이어리 점선 및 테두리 효과 */
        .binder-ring {
            background: radial-gradient(circle, #7a7a7a 20%, #c4c4c4 40%, #e0e0e0 70%);
        }
        .paper-border {
            border: 2px dashed #e2dad0;
        }
    </style>
</head>
<body class="bg-diary-bg min-h-screen font-sans text-stone-800 p-4 md:p-8 flex items-center justify-center">

    <!-- [다이어리 바깥 커버] -->
    <div class="w-full max-w-5xl bg-diary-cover rounded-3xl p-4 md:p-6 shadow-2xl border border-stone-300 relative flex flex-col md:flex-row">
        
        <!-- [다이어리 내지 (종이)] -->
        <div class="flex-1 bg-diary-paper rounded-2xl p-6 md:p-8 shadow-inner border border-stone-200 relative flex flex-col">
            
            <!-- 상단 헤더: 타이틀 & TODAY 날짜 -->
            <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-4 mb-6 border-b-2 border-stone-200 gap-2">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-stone-800 flex items-center gap-2">
                        📓 JOB DIARY
                    </h1>
                    <p class="text-xs text-stone-500">오늘도 나의 취업 준비를 기록해요 ✏️</p>
                </div>
                <!-- TODAY 날짜 표시 (README 명세) -->
                <div class="bg-amber-100/70 border border-amber-300/80 rounded-xl px-3 py-1 text-right">
                    <span class="text-[10px] uppercase font-bold text-amber-800 block">TODAY</span>
                    <span id="today-date" class="text-sm font-semibold text-stone-700">2026.09.16</span>
                </div>
            </header>

            <!-- 메인 본문 콘텐츠 (HOME) -->
            <main class="space-y-6 flex-1">
                
                <!-- 1. 인사말 카드 -->
                <section class="bg-white/80 p-4 rounded-xl border border-stone-200 shadow-sm">
                    <h2 class="text-lg font-bold text-stone-700">안녕하세요! 👋</h2>
                    <p class="text-sm text-stone-600 mt-1">오늘도 취업 준비를 시작해볼까요?</p>
                </section>

                <!-- 2. 취준 현황 요약 카드 (README 명세) -->
                <section class="grid grid-cols-3 gap-3">
                    <div class="bg-orange-50 border border-orange-200 rounded-xl p-3 text-center">
                        <div class="text-xs text-orange-700 font-semibold">TODO</div>
                        <div class="text-2xl font-bold text-orange-900 mt-1">3</div>
                    </div>
                    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-center">
                        <div class="text-xs text-emerald-700 font-semibold">저장된 채용공고</div>
                        <div class="text-2xl font-bold text-emerald-900 mt-1">8</div>
                    </div>
                    <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-center">
                        <div class="text-xs text-amber-700 font-semibold">다가오는 마감</div>
                        <div class="text-2xl font-bold text-amber-900 mt-1">2</div>
                    </div>
                </section>

                <!-- 3. TODAY'S TODO & 오늘의 운세 2단 레이아웃 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    
                    <!-- TODAY'S TODO -->
                    <section class="bg-stone-50/70 border border-stone-200 rounded-xl p-4 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <h3 class="font-bold text-stone-700 text-sm flex items-center gap-1">
                                    📋 TODAY'S TODO
                                </h3>
                                <a href="#" class="text-xs text-stone-400 hover:text-stone-700">더보기 &rsaquo;</a>
                            </div>
                            <ul class="space-y-2 text-sm text-stone-600">
                                <li class="flex items-center gap-2">
                                    <input type="checkbox" id="todo1" class="rounded border-stone-300 text-amber-600 focus:ring-0">
                                    <label for="todo1">자기소개서 작성</label>
                                </li>
                                <li class="flex items-center gap-2">
                                    <input type="checkbox" id="todo2" class="rounded border-stone-300 text-amber-600 focus:ring-0">
                                    <label for="todo2">기업 분석</label>
                                </li>
                                <li class="flex items-center gap-2">
                                    <input type="checkbox" id="todo3" class="rounded border-stone-300 text-amber-600 focus:ring-0">
                                    <label for="todo3">채용공고 확인</label>
                                </li>
                            </ul>
                        </div>
                    </section>

                    <!-- 4. 오늘의 운세 (Today's Fortune - README 14번 명세) -->
                    <section class="bg-amber-50/40 border border-amber-200/70 rounded-xl p-4 relative">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-bold text-amber-900 text-sm flex items-center gap-1">
                                🔮 TODAY'S FORTUNE
                            </h3>
                            <span id="fortune-stars" class="text-xs text-amber-600 font-bold">⭐⭐⭐⭐☆</span>
                        </div>
                        <p id="fortune-text" class="text-sm text-stone-700 mt-2 min-h-[40px] leading-relaxed">
                            오늘은 새로운 정보를 찾아보기 좋은 날이에요.
                        </p>
                        <div class="mt-3 pt-2 border-t border-amber-200/50 flex items-center gap-1 text-xs text-stone-600">
                            <span>🍀 Lucky Keyword:</span>
                            <span id="fortune-keyword" class="font-bold text-amber-800 bg-white px-2 py-0.5 rounded border border-amber-200">"도전"</span>
                        </div>
                    </section>

                </div>

            </main>

            <!-- 하단 바: 글로벌 Quick Memo 트리거 버튼 -->
            <footer class="mt-6 pt-4 border-t border-stone-200 flex justify-end">
                <button onclick="openMemoModal()" class="flex items-center gap-1.5 bg-amber-200/80 hover:bg-amber-300 border border-amber-400 text-amber-900 text-xs px-3 py-1.5 rounded-lg shadow-sm font-semibold transition">
                    📝 ＋ 메모
                </button>
            </footer>

        </div>

        <!-- [다이어리 바인더 인덱스 탭 (Cyworld / Retro Binder 탭 스타일)] -->
        <nav class="flex md:flex-col justify-around md:justify-start gap-1 mt-3 md:mt-8 md:ml-[-2px] overflow-x-auto">
            <!-- HOME 활성화 탭 -->
            <a href="#" class="bg-diary-paper text-stone-900 font-bold border-stone-300 border md:border-l-0 px-3 py-2 text-xs md:rounded-r-xl shadow-sm text-center">
                🏠 HOME
            </a>
            <a href="#" class="bg-tab-inactive hover:bg-amber-100 text-stone-600 border border-stone-300 md:border-l-0 px-3 py-2 text-xs md:rounded-r-xl text-center transition">
                01 TODO
            </a>
            <a href="#" class="bg-tab-inactive hover:bg-amber-100 text-stone-600 border border-stone-300 md:border-l-0 px-3 py-2 text-xs md:rounded-r-xl text-center transition">
                02 HISTORY
            </a>
            <a href="#" class="bg-tab-inactive hover:bg-amber-100 text-stone-600 border border-stone-300 md:border-l-0 px-3 py-2 text-xs md:rounded-r-xl text-center transition">
                03 REVIEW
            </a>
            <a href="#" class="bg-tab-inactive hover:bg-amber-100 text-stone-600 border border-stone-300 md:border-l-0 px-3 py-2 text-xs md:rounded-r-xl text-center transition">
                04 JOBS
            </a>
            <a href="#" class="bg-tab-inactive hover:bg-amber-100 text-stone-600 border border-stone-300 md:border-l-0 px-3 py-2 text-xs md:rounded-r-xl text-center transition">
                05 AI
            </a>
        </nav>
    </div>

    <!-- [6. 글로벌 퀵 메모 모달 (README 명세)] -->
    <div id="quick-memo-modal" class="hidden fixed inset-0 bg-stone-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-diary-paper border-2 border-stone-300 w-full max-w-sm rounded-2xl p-5 shadow-2xl relative">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-sm text-stone-800 flex items-center gap-1">
                    📝 QUICK MEMO
                </h3>
                <span class="text-[11px] text-stone-400 bg-stone-100 px-2 py-0.5 rounded">[00 HOME]</span>
            </div>
            
            <textarea id="memo-input" rows="4" placeholder="메모할 내용을 자유롭게 적어보세요..." 
                class="w-full text-xs p-3 rounded-lg border border-stone-200 bg-amber-50/20 focus:outline-none focus:ring-1 focus:ring-amber-400 resize-none"></textarea>
            
            <div class="flex justify-end gap-2 mt-3">
                <button onclick="closeMemoModal()" class="px-3 py-1.5 text-xs text-stone-500 hover:text-stone-700">
                    닫기
                </button>
                <button onclick="saveMemo()" class="px-3 py-1.5 text-xs bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-lg shadow-sm">
                    저장
                </button>
            </div>
        </div>
    </div>

    <!-- 간단한 인터랙션 스크립트 -->
    <script>
        // 1. 오늘의 운세 더미 풀 (초기 랜덤 문구 표출)
        const fortunes = [
            { star: "⭐⭐⭐⭐☆", text: "오늘은 새로운 정보를 찾아보기 좋은 날이에요.", keyword: "도전" },
            { star: "⭐⭐⭐⭐⭐", text: "준비해왔던 역량을 온전히 뽐낼 수 있는 자신감 넘치는 날입니다.", keyword: "자신감" },
            { star: "⭐⭐⭐☆☆", text: "조급해하지 말고 기본기를 점검하며 호흡을 가다듬으세요.", keyword: "차분함" },
            { star: "⭐⭐⭐⭐☆", text: "서류나 메모를 꼼꼼히 검토하면 좋은 기회를 발견할 수 있어요.", keyword: "디테일" }
        ];

        // 페이지 로드 시 랜덤 운세 설정
        window.addEventListener('DOMContentLoaded', () => {
            const randomItem = fortunes[Math.floor(Math.random() * fortunes.length)];
            document.getElementById('fortune-stars').innerText = randomItem.star;
            document.getElementById('fortune-text').innerText = randomItem.text;
            document.getElementById('fortune-keyword').innerText = `"${randomItem.keyword}"`;
        });

        // 2. 퀵 메모 모달 제어
        function openMemoModal() {
            document.getElementById('quick-memo-modal').classList.remove('hidden');
        }

        function closeMemoModal() {
            document.getElementById('quick-memo-modal').classList.add('hidden');
            document.getElementById('memo-input').value = '';
        }

        function saveMemo() {
            const text = document.getElementById('memo-input').value.trim();
            if (!text) {
                alert('메모 내용을 입력해주세요.');
                return;
            }
            // 향후 Flask API와 연동: /api/memos (page_index: 'HOME')
            alert('메모가 등록되었습니다! (추후 DB memos 테이블에 저장)');
            closeMemoModal();
        }
    </script>
</body>
</html>
